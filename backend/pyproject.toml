[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fixture-generator-backend"
version = "0.1.0"
description = "Backend foundation for Fixture Generator"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.115.6", "uvicorn[standard]==0.34.0"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.3.4", "ruff==0.8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/persistence/sqlite.py" = ["E501"]

[tool.setuptools.packages.find]
include = ["app*"]
